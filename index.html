<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background:radial-gradient(circle at top, #ff5f6d, #ffc371);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.heart{
    position:absolute;
    animation:float 6s linear infinite;
    opacity:.8;
}

@keyframes float{
    0%{transform:translateY(100vh) scale(1);}
    100%{transform:translateY(-10vh) scale(1.5); opacity:0;}
}

.container{
    background:rgba(255,255,255,.2);
    padding:30px;
    border-radius:25px;
    backdrop-filter:blur(10px);
    max-width:90%;
}

h1{
    color:#fff;
    font-size:clamp(24px,6vw,48px);
    font-weight:900;
    min-height:90px;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:20px;
    position:relative;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

#yesBtn{
    background:#00ffb3;
}

#noBtn{
    background:#ff1744;
    color:white;
    position:absolute;
}

.success{
    display:none;
    flex-direction:column;
    gap:20px;
}

.success h2{
    font-size:clamp(26px,7vw,52px);
    color:white;
    font-weight:900;
}

.success img{
    width:220px;
    border-radius:20px;
}

.whatsapp{
    background:#25D366;
    color:white;
    padding:15px 25px;
    border-radius:40px;
    font-weight:700;
    text-decoration:none;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<div class="container" id="main">
    <h1 id="typeText"></h1>
    <div class="buttons">
        <button id="yesBtn">YES 💖</button>
        <button id="noBtn">NO 💔</button>
    </div>
</div>

<div class="success" id="success">
    <h2>I KNEW YOU LOVE ME 😍🔥</h2>
    <img src="https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif">
    <a class="whatsapp" 
       href="https://wa.me/?text=I%20just%20said%20YES%20❤️%20Best%20Valentine%20Ever!"
       target="_blank">
       Share on WhatsApp 💬
    </a>
</div>

<script>
/* typing text */
const text = "SHUBHI, WILL YOU BE MY VALENTINE? 💘";
let i=0;
const speed=80;
const el=document.getElementById("typeText");

function type(){
  if(i<text.length){
    el.innerHTML += text.charAt(i);
    i++;
    setTimeout(type,speed);
  }
}
type();

/* hearts */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(Math.random()*30+15)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},250);

/* NO button run */
const noBtn=document.getElementById("noBtn");
function moveNo(){
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",moveNo);
noBtn.addEventListener("click",e=>e.preventDefault());

/* YES click */
document.getElementById("yesBtn").onclick=()=>{
    document.getElementById("music").play();
    document.getElementById("main").style.display="none";
    document.getElementById("success").style.display="flex";
};
</script>

</body>
</html>
